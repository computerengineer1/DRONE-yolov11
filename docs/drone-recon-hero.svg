      <text x="41" y="154" fill="#bbf7d0">OBJECT  ·  0.84</text>
      <rect x="200" y="76" width="99" height="15" rx="3" fill="#10333d"/>
      <text x="206" y="87" fill="#a5f3fc">CLASS  ·  0.91</text>
      <rect x="249" y="174" width="110" height="15" rx="3" fill="#10333d"/>
      <text x="255" y="185" fill="#a5f3fc">TRACK  ·  ID 03</text>
