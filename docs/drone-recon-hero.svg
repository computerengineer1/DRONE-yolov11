      <text x="14" y="168" font-size="22" fill="#e2e8f0">24.8 <tspan font-size="10" fill="#64748b">FPS*</tspan></text>
      <text x="14" y="193" font-size="9" fill="#64748b">INFERENCE</text>
      <text x="14" y="215" font-size="22" fill="#e2e8f0">38.4 <tspan font-size="10" fill="#64748b">ms*</tspan></text>
      <text x="14" y="245" font-size="8" fill="#64748b">*Illustrative values only</text>
    </g>
    <text x="20" y="341" font-size="9" fill="#64748b">Bounding boxes and telemetry are illustrative UI artwork.</text>
    <text x="580" y="367" text-anchor="end" font-size="9" fill="#64748b">NOT FOR OPERATIONAL USE</text>
