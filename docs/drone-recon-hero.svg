      <text x="14" y="93" font-size="9" fill="#64748b">ASSOCIATION</text>
      <text x="146" y="93" text-anchor="end" font-size="9" fill="#4ade80">TRACKER</text>
      <rect x="14" y="103" width="132" height="5" rx="2.5" fill="#1c3842"/>
      <rect x="14" y="103" width="76" height="5" rx="2.5" fill="#4ade80"/>
      <path d="M14 125H146" stroke="#2a4652"/>
