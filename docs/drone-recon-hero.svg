<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
  <title id="t">Drone Recon — YOLO-based computer vision and tracking</title>
  <desc id="d">A conceptual engineering graphic of an aerial camera feed, computer-vision bounding boxes, and a telemetry panel. This is artwork, not a screenshot from the application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121c"/>
      <stop offset=".58" stop-color="#0b1e2a"/>
      <stop offset="1" stop-color="#11182b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#213d3b"/>
      <stop offset="1" stop-color="#102328"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#8be9fd" stroke-opacity=".07" fill="none"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="1200" height="480" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="26" fill="url(#grid)"/>
  <circle cx="1020" cy="64" r="175" fill="#0e7490" opacity=".1"/>
  <path d="M650 0H1200V480H530C610 395 590 318 655 242S715 97 650 0Z" fill="#102536" opacity=".55"/>
  <g font-family="Consolas,Menlo,monospace">
