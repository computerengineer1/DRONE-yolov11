    <circle cx="74" cy="64" r="4" fill="#4ade80"/>
    <text x="88" y="69" font-size="11" fill="#a5f3fc" font-weight="700" letter-spacing="1.5">VISION SYSTEM</text>
    <text x="56" y="132" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-1.2">DRONE RECON</text>
    <text x="58" y="166" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#67e8f9">YOLOv11 · Detection · Multi-object tracking</text>
    <text x="58" y="204" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#cbd5e1">A Python desktop prototype for reviewing video,</text>
    <text x="58" y="226" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#cbd5e1">camera streams, detections, and track continuity.</text>
    <g transform="translate(58 258)">
      <rect width="120" height="30" rx="7" fill="#102836" stroke="#245365"/>
      <text x="60" y="19" text-anchor="middle" font-size="10" fill="#a5f3fc" font-weight="700">OPENCV</text>
      <rect x="130" width="142" height="30" rx="7" fill="#102836" stroke="#245365"/>
      <text x="201" y="19" text-anchor="middle" font-size="10" fill="#a5f3fc" font-weight="700">KALMAN + IOU</text>
      <rect x="282" width="138" height="30" rx="7" fill="#112b22" stroke="#25684a"/>
      <text x="351" y="19" text-anchor="middle" font-size="10" fill="#bbf7d0" font-weight="700">CUDA OPTIONAL</text>
    </g>
    <text x="58" y="344" font-size="11" fill="#64748b" letter-spacing="2">COMPUTER VISION · VISUALIZATION · RESEARCH</text>
    <text x="58" y="419" font-size="10" fill="#64748b">CONCEPT ART — NOT A LIVE APPLICATION SCREENSHOT</text>
  </g>
